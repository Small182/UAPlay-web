name: Verify and deploy UAPlay Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Test API
        run: npm run check
      - name: Build Cloudflare Pages drag-and-drop ZIP
        run: npm run build:pages -- UAPlay-web-cloudflare-pages-v0.5.51.zip
      - name: Upload Cloudflare Pages ZIP
        uses: actions/upload-artifact@v4
        with:
          name: uaplay-cloudflare-pages-zip
          path: UAPlay-web-cloudflare-pages-v0.5.51.zip
      - name: Publish to Cloudflare Workers
        # Run the tests even before the Cloudflare connection has been configured.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy